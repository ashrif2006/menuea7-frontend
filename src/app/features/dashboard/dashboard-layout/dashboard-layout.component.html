<div class="dash-shell">
  <!-- Ambient glow زي صفحة المنيو -->
  <div class="ambient-glow"></div>

  <!-- Top identity bar -->
  <header class="dash-topbar">
    <div class="brand-mark">
      <span class="brand-dot"></span>
      <span>{{ authService.currentUser()?.cafeName }}</span>
    </div>
    <button class="logout-chip" (click)="logout()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </button>
  </header>

  <div class="dash-body">
    <!-- Icon rail (desktop فقط) -->
    <aside class="icon-rail">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" title="الرئيسية">
        <i class="fa-solid fa-house"></i>
      </a>
      <a routerLink="/dashboard/categories" routerLinkActive="active" title="التصنيفات">
        <i class="fa-solid fa-layer-group"></i>
      </a>
      <a routerLink="/dashboard/menu-items" routerLinkActive="active" title="الأصناف">
        <i class="fa-solid fa-mug-saucer"></i>
      </a>
      <a routerLink="/dashboard/qr-code" routerLinkActive="active" title="كود QR">
        <i class="fa-solid fa-qrcode"></i>
      </a>
    </aside>

    <main class="dash-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Floating tab bar (موبايل فقط) -->
  <nav class="tab-bar">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <i class="fa-solid fa-house"></i>
      <span>الرئيسية</span>
    </a>
    <a routerLink="/dashboard/categories" routerLinkActive="active">
      <i class="fa-solid fa-layer-group"></i>
      <span>تصنيفات</span>
    </a>
    <a routerLink="/dashboard/menu-items" routerLinkActive="active">
      <i class="fa-solid fa-mug-saucer"></i>
      <span>أصناف</span>
    </a>
    <a routerLink="/dashboard/qr-code" routerLinkActive="active">
      <i class="fa-solid fa-qrcode"></i>
      <span>QR</span>
    </a>
  </nav>
</div>
