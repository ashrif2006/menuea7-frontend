<div class="dashboard-wrapper">
  <!-- Sidebar (desktop فقط) -->
  <aside class="sidebar">
    <div class="sidebar-logo">A7-Menu</div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </a>
      <a routerLink="/dashboard/categories" routerLinkActive="active">
        <i class="fa-solid fa-folder"></i>
        <span>التصنيفات</span>
      </a>
      <a routerLink="/dashboard/menu-items" routerLinkActive="active">
        <i class="fa-solid fa-utensils"></i>
        <span>الأصناف</span>
      </a>
      <a routerLink="/dashboard/qr-code" routerLinkActive="active">
        <i class="fa-solid fa-qrcode"></i>
        <span>كود QR</span>
      </a>
    </nav>
  </aside>

  <!-- Main -->
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-cafe-name">{{ authService.currentUser()?.cafeName }}</div>
      <button class="btn-logout" (click)="logout()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>خروج</span>
      </button>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

    <!-- Bottom Nav (موبايل فقط) -->
    <nav class="bottom-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>
      </a>
      <a routerLink="/dashboard/categories" routerLinkActive="active">
        <i class="fa-solid fa-folder"></i>
        <span>التصنيفات</span>
      </a>
      <a routerLink="/dashboard/menu-items" routerLinkActive="active">
        <i class="fa-solid fa-utensils"></i>
        <span>الأصناف</span>
      </a>
      <a routerLink="/dashboard/qr-code" routerLinkActive="active">
        <i class="fa-solid fa-qrcode"></i>
        <span>QR</span>
      </a>
    </nav>
  </div>
</div>
